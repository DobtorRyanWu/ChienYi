<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景 -->
  <rect width="100" height="100" fill="#3498db"/>

  <!-- 文件/剪貼板圖示 -->
  <rect x="25" y="15" width="50" height="70" rx="3" fill="white"/>
  <rect x="35" y="10" width="30" height="10" rx="2" fill="#2980b9"/>

  <!-- 勾選項目 (代表稽核追蹤) -->
  <line x1="32" y1="35" x2="40" y2="35" stroke="#3498db" stroke-width="3"/>
  <polyline points="42,33 45,37 52,28" fill="none" stroke="#27ae60" stroke-width="3"/>

  <line x1="32" y1="50" x2="40" y2="50" stroke="#3498db" stroke-width="3"/>
  <polyline points="42,48 45,52 52,43" fill="none" stroke="#27ae60" stroke-width="3"/>

  <line x1="32" y1="65" x2="40" y2="65" stroke="#3498db" stroke-width="3"/>
  <polyline points="42,63 45,67 52,58" fill="none" stroke="#27ae60" stroke-width="3"/>

  <!-- 描述文字線條 -->
  <line x1="55" y1="35" x2="68" y2="35" stroke="#bdc3c7" stroke-width="2"/>
  <line x1="55" y1="50" x2="68" y2="50" stroke="#bdc3c7" stroke-width="2"/>
  <line x1="55" y1="65" x2="68" y2="65" stroke="#bdc3c7" stroke-width="2"/>
</svg>
