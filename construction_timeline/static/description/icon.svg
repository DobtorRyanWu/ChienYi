<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="10" fill="#3498db"/>
  <g fill="white">
    <!-- 甘特圖條形 -->
    <rect x="15" y="20" width="35" height="8" rx="2"/>
    <rect x="25" y="35" width="45" height="8" rx="2"/>
    <rect x="35" y="50" width="40" height="8" rx="2"/>
    <rect x="20" y="65" width="55" height="8" rx="2"/>
    <!-- 時間軸 -->
    <line x1="10" y1="80" x2="90" y2="80" stroke="white" stroke-width="2"/>
    <circle cx="20" cy="80" r="3"/>
    <circle cx="40" cy="80" r="3"/>
    <circle cx="60" cy="80" r="3"/>
    <circle cx="80" cy="80" r="3"/>
  </g>
