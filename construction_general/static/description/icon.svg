<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="10" fill="url(#grad1)"/>
  <!-- Construction building icon -->
  <g fill="#FFFFFF">
    <!-- Building base -->
    <rect x="20" y="45" width="60" height="40" rx="2"/>
    <!-- Roof -->
    <polygon points="15,47 50,20 85,47"/>
    <!-- Windows -->
    <rect x="28" y="55" width="12" height="10" fill="#1976D2"/>
    <rect x="44" y="55" width="12" height="10" fill="#1976D2"/>
    <rect x="60" y="55" width="12" height="10" fill="#1976D2"/>
    <!-- Door -->
    <rect x="42" y="70" width="16" height="15" fill="#1976D2"/>
    <!-- Progress bar -->
    <rect x="15" y="90" width="70" height="6" rx="3" fill="#BBDEFB"/>
    <rect x="15" y="90" width="50" height="6" rx="3" fill="#4CAF50"/>
  </g>
</svg>
